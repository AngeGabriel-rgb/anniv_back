<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anniversaire</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card" id="birthdayCard">
      <!-- Top banner -->
      <div class="banner">
        <span>Happy burst</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5.8 11.3 2 22l10.7-3.79"></path>
          <path d="M4 3h.01"></path>
          <path d="M22 8h.01"></path>
          <path d="M15 2h.01"></path>
          <path d="M22 20h.01"></path>
          <path d="m22 2-2.24.75a2.9 2.9 0 0 0-1.96 3.12v0c.1.86-.57 1.63-1.45 1.63h-.38c-.86 0-1.6.6-1.76 1.44L14 10"></path>
          <path d="m22 13-.82-.33c-.86-.34-1.82.2-1.98 1.11v0c-.11.7-.72 1.22-1.43 1.22H17"></path>
          <path d="m11 2 .33.82c.34.86-.2 1.82-1.11 1.98v0C9.52 4.9 9 5.52 9 6.23V7"></path>
          <path d="M11 13c1.93 1.93 2.83 4.17 2 5-.83.83-3.07-.07-5-2-1.93-1.93-2.83-4.17-2-5 .83-.83 3.07.07 5 2Z"></path>
        </svg>
      </div>

      <div class="image-container">
        <img src="https://rushout.fr/wp-content/uploads/2021/05/emery-meyer-wfagt4jXXA8-unsplash-scaled.jpg" alt="Birthday celebration", width="40", height="40">
    </div>

      <!-- Text overlay -->
      <div class="text-overlay">
        <p>Rejoignez-moi pour célébrer une année de plus de rires, d'aventures et de souvenirs !</p>
        <button id="actionButton">RSVP</button>
      </div>

      <!-- Flow 1 label -->
      <div class="flow-label">Flow 1</div>

      <!-- Registration Form -->
      <div class="registration-form" id="registrationForm">
        <div class="form-header">
          <h2>Inscription</h2>
          <button class="close-button" id="closeForm">&times;</button>
        </div>
        <form id="rsvpForm">
          <div class="form-group">
            <label for="firstName">Prénom</label>
            <input type="text" id="firstName" name="firstName" required>
          </div>
          <div class="form-group">
            <label for="lastName">Nom</label>
            <input type="text" id="lastName" name="lastName" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
          <button type="submit" class="submit-button">Confirmer</button>
        </form>
      </div>

      <!-- Thank You Popup -->
      <div class="thank-you-popup" id="thankYouPopup">
        <div class="icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </div>
        <h3>Merci pour votre inscription !</h3>
        <p>Vous recevrez bientôt un email de confirmation avec tous les détails de l'événement.</p>
        <button id="closeThankYou">D'accord</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
